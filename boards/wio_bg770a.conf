# RFT: Wio BG770A board overrides for firmware-receiver.
#
# This board has no USB HID — packets are forwarded over LTE via BG770A-GL.
# CDC ACM (USB serial) stays on for console / log during bench debugging.

CONFIG_USB_DEVICE_MANUFACTURER="Seeed Studio"
CONFIG_USB_DEVICE_PRODUCT="RideFormTracker Receiver (LTE)"

# Disable USB HID; we ship tracker packets over LTE instead.
CONFIG_USB_DEVICE_HID=n

# RFT: Wio BG770A boot bisect (2026-05-11) — with CONFIG_ASSERT=y enabled
# on Wio (matsujirushi fork board defs), some internal __ASSERT fires
# before USB CDC enumerates, so we can't even see the message. Turn
# asserts off here; revisit once an SWD/RTT path is available.
CONFIG_ASSERT=n

# UART driver to BG770A-GL modem (uart1 is enabled by board DTS). The
# modem driver in src/connection/modem.c uses the async API. Without the
# explicit `CONFIG_UART_1_INTERRUPT_DRIVEN=n`, prj.conf's global
# CONFIG_UART_INTERRUPT_DRIVEN=y wins on the per-instance Kconfig and
# uart_callback_set() returns -ENOTSUP (-88).
CONFIG_UART_ASYNC_API=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_ASYNC=y
# Allow runtime baud-rate changes on uart1. Needed for the auto-bootstrap
# that drops to 115200 (BG770A factory default) when a fresh modem doesn't
# answer at 921600, sets AT+IPR=921600;&W, and switches back. Without this
# uart_configure() returns -ENOSYS.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
