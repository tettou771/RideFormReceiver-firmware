# Sysbuild config for running the RECEIVER firmware on a tracker PCB
# (rft_pcb_v1_1). The tracker board already has MCUboot installed from a
# previous tracker firmware flash, so this build produces the matching
# `app_update.bin` so we can USB-update it in place via `update.command`
# without opening the case for SWD.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
